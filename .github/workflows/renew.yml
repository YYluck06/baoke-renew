name: 宝可梦月度续期

# ============================================================
# 公开库只有这一个工作流；代码在私有库（vars.CODE_REPO），运行时 checkout 到 app/ 执行。
# 续期码传递：ask 写 code.txt → 上传 artifact → 各账号 job 下载（不用 job outputs，避免静默失败）。
#
# 需配置（公开库 Settings → Secrets and variables → Actions）：
#   Variables: CODE_REPO       = 用户名/baoke-renew-core
#              （PROXY_NODE_1/2/3 放 Variables 或 Secrets 都可以，工作流两个都读）
#   Secrets  : CODE_REPO_TOKEN = 只读私有库的细粒度 PAT
#              TG_TOKEN / TG_CHAT
#              ACC1_EMAIL / ACC1_PASS / ACC2_EMAIL / ACC2_PASS / ACC3_EMAIL / ACC3_PASS
#              PROXY_NODE_1 / PROXY_NODE_2 / PROXY_NODE_3（留空 = 直连）
#
# 手动触发时可勾选 selftest：只跑代理自测（全部假节点、不碰账号），用来验证 sing-box 通路
# ============================================================

on:
  schedule:
    - cron: '0 13 1 * *'          # 每月 1 号 13:00 UTC = 北京 21:00
  workflow_dispatch:
    inputs:
      code:
        description: '续期码（留空则去 Telegram 里问你）'
        required: false
      dry:
        description: '只演练不下单'
        type: boolean
        default: false
      selftest:
        description: '只跑代理隔离自测（假节点，不碰账号）'
        type: boolean
        default: false

concurrency:
  group: pokemon-renew
  cancel-in-progress: false

# 保活任务要往公开库提交时间戳，所以需要写权限
permissions:
  contents: write

jobs:
  # ---------------- 0) 代理隔离自测（手动勾选 selftest 才跑） ----------------
  proxy-selftest:
    if: ${{ inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检查 CODE_REPO 变量
        run: |
          if [ -z "${{ vars.CODE_REPO }}" ]; then
            echo "::error::没有配置仓库变量 CODE_REPO（应为 用户名/baoke-renew-core）"; exit 1
          fi
      - name: 拉取私有代码仓
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载 sing-box（固定 v1.13.14）
        run: |
          mkdir -p /tmp/sb
          curl -fL --retry 3 --connect-timeout 15 \
            -o /tmp/sb/sb.tgz \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz
          tar -xzf /tmp/sb/sb.tgz -C /tmp/sb
          chmod +x /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box
          /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box version | head -1
      - name: 跑隔离自测（全部假节点：socks5 无认证 / socks5 带认证 / hy2 / vmess）
        working-directory: app
        env:
          SB_BIN: /tmp/sb/sing-box-1.13.14-linux-amd64/sing-box
        run: node scripts/selftest-proxy.mjs

  # ---------------- 1) 问续期码 ----------------
  ask:
    if: ${{ !inputs.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      code: ${{ steps.ask.outputs.code }}
    steps:
      - name: 检查 CODE_REPO 变量
        run: |
          if [ -z "${{ vars.CODE_REPO }}" ]; then
            echo "::error::没有配置仓库变量 CODE_REPO（Settings → Secrets and variables → Actions → Variables），值应为 用户名/baoke-renew-core"
            exit 1
          fi
      - name: 拉取私有代码仓
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 在 Telegram 里询问续期码
        id: ask
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          WAIT_MINUTES: '45'
          INPUT_CODE: ${{ inputs.code }}
          CODE_FILE: ${{ github.workspace }}/code.txt
        run: node scripts/ask-code.mjs
      - name: 诊断 output 是否为空
        env:
          V: ${{ steps.ask.outputs.code }}
        run: echo "ask 的 output 长度 = ${#V}"
      - name: 校验续期码文件
        run: |
          if [ ! -s code.txt ]; then
            echo "::error::没有拿到续期码（code.txt 为空）→ 看上面「在 Telegram 里询问续期码」那一步的日志"
            exit 1
          fi
          echo "code.txt 大小: $(wc -c < code.txt) 字节"
      - name: 上传续期码给后续 job
        uses: actions/upload-artifact@v4
        with:
          name: coupon-code
          path: code.txt
          retention-days: 1

  # ---------------- 2) 账号1 ----------------
  renew-1:
    needs: ask
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACC_LABEL: '账号1'
      ACC_EMAIL: ${{ secrets.ACC1_EMAIL }}
      ACC_PASS: ${{ secrets.ACC1_PASS }}
      PROXY_NODE: ${{ secrets.PROXY_NODE_1 || vars.PROXY_NODE_1 }}
      PROXY_SRC: ${{ secrets.PROXY_NODE_1 && 'Secrets.PROXY_NODE_1' || (vars.PROXY_NODE_1 && 'Variables.PROXY_NODE_1' || '两者都为空') }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      DRY: ${{ inputs.dry && '1' || '' }}
      # 剩余天数 > 30 天就跳过（本月已经续过），避免浪费码 / 触发「该优惠券每人只能用 1 次」
      SKIP_IF_DAYS_GT: '30'
    steps:
      - name: 拉取私有代码仓
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - name: 下载续期码
        uses: actions/download-artifact@v4
        with:
          name: coupon-code
          path: .
      - name: 读取续期码
        run: |
          CODE=$(tr -d '\r\n' < code.txt)
          if [ -z "$CODE" ]; then echo "::error::续期码为空"; exit 1; fi
          echo "::add-mask::$CODE"
          echo "COUPON_CODE=$CODE" >> "$GITHUB_ENV"
          echo "续期码长度 ${#CODE}"
      - name: 账号 / 代理配置预检
        env:
          P: ${{ secrets.PROXY_NODE_1 || vars.PROXY_NODE_1 }}
          E: ${{ secrets.ACC1_EMAIL }}
        run: |
          echo "账号1 邮箱是否已配: $([ -n "$E" ] && echo yes || echo NO)"
          echo "账号1 密码是否已配: $([ -n "${{ secrets.ACC1_PASS }}" ] && echo yes || echo NO)"
          echo "代理节点长度: ${#P}（0 = 直连）"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: 安装浏览器
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: 启动代理（节点1）
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-proxy.sh
      - name: 免费续期 + 推送订阅链接
        working-directory: app
        run: node scripts/run-account.mjs
      - name: 失败告警
        if: failure()
        working-directory: app
        run: node -e "import('./scripts/tg.mjs').then(m=>m.send('⚠️ 账号1 续期 job 异常结束，请到 Actions 日志查看')).catch(e=>console.error(e.message))"

  # ---------------- 3) 账号2 ----------------
  renew-2:
    needs: ask
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACC_LABEL: '账号2'
      ACC_EMAIL: ${{ secrets.ACC2_EMAIL }}
      ACC_PASS: ${{ secrets.ACC2_PASS }}
      PROXY_NODE: ${{ secrets.PROXY_NODE_2 || vars.PROXY_NODE_2 }}
      PROXY_SRC: ${{ secrets.PROXY_NODE_2 && 'Secrets.PROXY_NODE_2' || (vars.PROXY_NODE_2 && 'Variables.PROXY_NODE_2' || '两者都为空') }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      DRY: ${{ inputs.dry && '1' || '' }}
      SKIP_IF_DAYS_GT: '30'
    steps:
      - name: 拉取私有代码仓
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - name: 下载续期码
        uses: actions/download-artifact@v4
        with:
          name: coupon-code
          path: .
      - name: 读取续期码
        run: |
          CODE=$(tr -d '\r\n' < code.txt)
          if [ -z "$CODE" ]; then echo "::error::续期码为空"; exit 1; fi
          echo "::add-mask::$CODE"
          echo "COUPON_CODE=$CODE" >> "$GITHUB_ENV"
          echo "续期码长度 ${#CODE}"
      - name: 账号 / 代理配置预检
        env:
          P: ${{ secrets.PROXY_NODE_2 || vars.PROXY_NODE_2 }}
          E: ${{ secrets.ACC2_EMAIL }}
        run: |
          echo "账号2 邮箱是否已配: $([ -n "$E" ] && echo yes || echo NO)"
          echo "代理节点长度: ${#P}（0 = 直连）"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: 安装浏览器
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: 启动代理（节点2）
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-proxy.sh
      - name: 免费续期 + 推送订阅链接
        working-directory: app
        run: node scripts/run-account.mjs
      - name: 失败告警
        if: failure()
        working-directory: app
        run: node -e "import('./scripts/tg.mjs').then(m=>m.send('⚠️ 账号2 续期 job 异常结束，请到 Actions 日志查看')).catch(e=>console.error(e.message))"

  # ---------------- 4) 账号3 ----------------
  renew-3:
    needs: ask
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACC_LABEL: '账号3'
      ACC_EMAIL: ${{ secrets.ACC3_EMAIL }}
      ACC_PASS: ${{ secrets.ACC3_PASS }}
      PROXY_NODE: ${{ secrets.PROXY_NODE_3 || vars.PROXY_NODE_3 }}
      PROXY_SRC: ${{ secrets.PROXY_NODE_3 && 'Secrets.PROXY_NODE_3' || (vars.PROXY_NODE_3 && 'Variables.PROXY_NODE_3' || '两者都为空') }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      DRY: ${{ inputs.dry && '1' || '' }}
      SKIP_IF_DAYS_GT: '30'
    steps:
      - name: 拉取私有代码仓
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          path: app
          persist-credentials: false
      - name: 下载续期码
        uses: actions/download-artifact@v4
        with:
          name: coupon-code
          path: .
      - name: 读取续期码
        run: |
          CODE=$(tr -d '\r\n' < code.txt)
          if [ -z "$CODE" ]; then echo "::error::续期码为空"; exit 1; fi
          echo "::add-mask::$CODE"
          echo "COUPON_CODE=$CODE" >> "$GITHUB_ENV"
          echo "续期码长度 ${#CODE}"
      - name: 账号 / 代理配置预检
        env:
          P: ${{ secrets.PROXY_NODE_3 || vars.PROXY_NODE_3 }}
          E: ${{ secrets.ACC3_EMAIL }}
        run: |
          echo "账号3 邮箱是否已配: $([ -n "$E" ] && echo yes || echo NO)"
          echo "代理节点长度: ${#P}（0 = 直连）"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: 安装浏览器
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: 启动代理（节点3）
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-proxy.sh
      - name: 免费续期 + 推送订阅链接
        working-directory: app
        run: node scripts/run-account.mjs
      - name: 失败告警
        if: failure()
        working-directory: app
        run: node -e "import('./scripts/tg.mjs').then(m=>m.send('⚠️ 账号3 续期 job 异常结束，请到 Actions 日志查看')).catch(e=>console.error(e.message))"

  # ---------------- 5) 仓库保活（防 60 天无活动被停用 cron） ----------------
  keepalive:
    needs: [renew-1, renew-2, renew-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 公开库自身
        uses: actions/checkout@v4
      - name: 更新时间戳并提交
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > heartbeat.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore(keepalive): automated heartbeat $(date -u +'%Y-%m-%d')" || exit 0
          git push
